<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#0f172a"/>
  
  <!-- Team members -->
  <g opacity="0.8">
    <!-- Person 1 -->
    <circle cx="150" cy="200" r="50" fill="url(#teamGradient)"/>
    <rect x="125" y="260" width="50" height="80" fill="url(#teamGradient)"/>
    
    <!-- Person 2 -->
    <circle cx="300" cy="200" r="50" fill="url(#teamGradient)"/>
    <rect x="275" y="260" width="50" height="80" fill="url(#teamGradient)"/>
    
    <!-- Person 3 -->
    <circle cx="450" cy="200" r="50" fill="url(#teamGradient)"/>
    <rect x="425" y="260" width="50" height="80" fill="url(#teamGradient)"/>
  </g>
  
  <!-- Equipment -->
  <g opacity="0.6">
    <rect x="50" y="320" width="80" height="40" rx="5" fill="#475569"/>
    <rect x="250" y="320" width="80" height="40" rx="5" fill="#475569"/>
    <rect x="450" y="320" width="80" height="40" rx="5" fill="#475569"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#f8fafc">Unser erfahrenes Team</text>
</svg>