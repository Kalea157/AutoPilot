<svg width="1920" height="800" viewBox="0 0 1920 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="800" fill="url(#heroGradient)"/>
  
  <!-- Geometric patterns -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="100" fill="#2563eb"/>
    <circle cx="1600" cy="300" r="80" fill="#10b981"/>
    <circle cx="400" cy="600" r="60" fill="#f59e0b"/>
    <circle cx="1400" cy="500" r="120" fill="#2563eb"/>
  </g>
  
  <!-- Cleaning elements -->
  <g opacity="0.05">
    <!-- Water drops -->
    <path d="M100 150 C100 150, 120 170, 100 190 C80 170, 100 150, 100 150 Z" fill="#2563eb"/>
    <path d="M1800 250 C1800 250, 1820 270, 1800 290 C1780 270, 1800 250, 1800 250 Z" fill="#10b981"/>
    <path d="M300 650 C300 650, 320 670, 300 690 C280 670, 300 650, 300 650 Z" fill="#f59e0b"/>
    
    <!-- Cleaning brushes -->
    <rect x="1500" y="400" width="8" height="20" fill="#475569"/>
    <rect x="1495" y="420" width="18" height="3" fill="#475569"/>
    
    <rect x="200" y="500" width="6" height="15" fill="#64748b"/>
    <rect x="197" y="515" width="12" height="2" fill="#64748b"/>
  </g>
  
  <!-- Spotlight effect -->
  <circle cx="960" cy="400" r="400" fill="url(#spotlight)"/>
</svg>