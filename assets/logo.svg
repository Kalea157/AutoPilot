<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Cleaning icon -->
  <g transform="translate(15, 15)">
    <!-- Water drop -->
    <path d="M15 5 C15 5, 20 15, 15 25 C10 15, 15 5, 15 5 Z" fill="#2563eb"/>
    
    <!-- Cleaning brush -->
    <rect x="12" y="20" width="6" height="8" fill="#10b981"/>
    <rect x="10" y="28" width="10" height="2" fill="#10b981"/>
    
    <!-- Sparkles -->
    <circle cx="8" cy="12" r="1" fill="#f59e0b"/>
    <circle cx="22" cy="8" r="1" fill="#f59e0b"/>
    <circle cx="25" cy="18" r="1" fill="#f59e0b"/>
  </g>
  
  <!-- Company name -->
  <text x="70" y="25" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">MÜNSTER</text>
  <text x="70" y="45" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1">REINIGUNG</text>
</svg>