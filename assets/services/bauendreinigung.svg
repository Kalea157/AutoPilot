<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0f172a"/>
  
  <!-- Service icon background -->
  <circle cx="200" cy="120" r="60" fill="url(#serviceGradient)" opacity="0.3"/>
  
  <!-- Icon placeholder -->
  <rect x="170" y="90" width="60" height="60" rx="8" fill="#475569" opacity="0.5"/>
  
  <!-- Cleaning effect -->
  <g opacity="0.7">
    <circle cx="150" cy="80" r="3" fill="#2563eb"/>
    <circle cx="250" cy="70" r="2" fill="#10b981"/>
    <circle cx="200" cy="90" r="2" fill="#f59e0b"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#f8fafc">Bauendreinigung</text>
  <text x="200" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Professionelle Reinigung</text>
</svg>